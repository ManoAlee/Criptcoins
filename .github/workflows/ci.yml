name: Galaxy Bitcoin Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  engine-validation:
    name: Computational & Cryptographic Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Script Compilation
        run: |
          python -m py_compile topological_kernel.py lattice_engine.py matrix_kernel.py mandelbrot.py || true
        shell: bash

      - name: Run Core Validation
        run: |
          python -c "import topological_kernel; print('Topological Kernel Loaded')" || true
        shell: bash
